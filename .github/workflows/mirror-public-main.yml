name: Mirror public main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'Scale-Margins-V0/dispatcher-package-internal'
    runs-on: ubuntu-latest
    steps:
      - name: Check out internal main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to public mirror
        env:
          PUBLIC_MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git remote add public "https://x-access-token:${PUBLIC_MIRROR_TOKEN}@github.com/Scale-Margins-V0/dispatcher-package.git"
          git push --force public HEAD:main
