# ScaleMargin Dispatcher — local development stack.
#
# Default stack: dispatcher + MySQL 8 as the dispatcher's own state database
# (variables, activity history, logs, event outbox).
#
#   cp .env.yaml.example .env.yaml    # then fill in scalemargin: and
#   docker compose up --build         # dispatcher.retention.message_id_ttl
#
# Configuration comes from the mounted .env.yaml — there is no .env. The one
# exception is the state-database connection below: this file PROVIDES that
# database, so it owns the connection string, and a real environment variable
# always wins over .env.yaml.
#
# Alternatives:
#   - Attach ANY existing SQL DB instead: drop the mysql service and the two
#     DISPATCHER_DB_* lines below, and set dispatcher.database in .env.yaml.
#   - Zero-dependency mode: remove DISPATCHER_DB_* entirely — the dispatcher
#     falls back to a local SQLite file; mount ./data to keep it across
#     container restarts (volume already configured below).
#   - Postgres flavor: docker compose --profile postgres up --build and swap
#     the DISPATCHER_DB_* values on the dispatcher service (commented below).

services:
  dispatcher:
    build: .
    ports:
      - "3100:3100"
    environment:
      # Owned here because this file provides the database. Wins over
      # dispatcher.database in .env.yaml.
      DISPATCHER_DB_DIALECT: mysql
      DISPATCHER_DB_URL: mysql://dispatcher:dispatcher_pw@mysql:3306/dispatcher_state
      # Postgres flavor (with --profile postgres):
      # DISPATCHER_DB_DIALECT: postgres
      # DISPATCHER_DB_URL: postgres://dispatcher:dispatcher_pw@postgres:5432/dispatcher_state
      # Admin GUI at http://localhost:3100/admin. First boot seeds an owner —
      # set dispatcher.admin.email / .password in .env.yaml to control it, else
      # a random password is written once to the logs and
      # data/initial-admin-credentials.txt.
    volumes:
      # Create .env.yaml BEFORE the first `up`. If it is missing, Docker creates
      # a DIRECTORY at this path and the dispatcher boots in mock mode.
      - ./.env.yaml:/app/.env.yaml:ro
      - dispatcher-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dispatcher_state
      MYSQL_USER: dispatcher
      MYSQL_PASSWORD: dispatcher_pw
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dispatcher-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dispatcher", "-pdispatcher_pw"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: dispatcher_state
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher_pw
    volumes:
      - dispatcher-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatcher -d dispatcher_state"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dispatcher-data:
  dispatcher-mysql-data:
  dispatcher-postgres-data:
